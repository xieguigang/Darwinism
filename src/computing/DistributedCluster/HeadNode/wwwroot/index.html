<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darwinism Distributed Cluster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/kb.css" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="aurora"></div>

    <header class="topbar">
        <div class="brand">
            <span class="logo-dot"></span>
            <div>
                <h1 id="clusterName">Darwinism Cluster</h1>
                <span class="badge">DISTRIBUTED COMPUTING</span>
            </div>
        </div>
        <div class="topbar-meta">
            <span class="meta-chip" id="onlineChip">在线节点 0</span>
            <span class="meta-chip" id="clock">--:--:--</span>
            <span class="meta-chip task-chip" id="taskChip">
                <span class="task-status-dot" id="taskDot"></span>
                <span id="taskLabel">集群空闲</span>
            </span>
            <button id="btnOpenSubmit" class="btn btn-accent" type="button" title="提交计算任务">
                <span>＋ 提交任务</span>
            </button>
            <button id="themeToggle" class="btn theme-toggle" type="button" title="切换主题" aria-label="切换主题">
                <span class="theme-toggle-icon">☀</span>
                <span class="theme-toggle-label">Light</span>
            </button>
        </div>
    </header>

    <main class="grid">
        <!-- 算力 / 负载概览 -->
        <section class="card span-3">
            <h2 class="card-title">集群算力与负载</h2>
            <div class="metrics">
                <div class="metric">
                    <div class="metric-value" id="mTotalNodes">0</div>
                    <div class="metric-label">总节点</div>
                </div>
                <div class="metric">
                    <div class="metric-value accent" id="mOnline">0</div>
                    <div class="metric-label">在线节点</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="mCores">0</div>
                    <div class="metric-label">逻辑核心</div>
                </div>
                <div class="metric">
                    <div class="metric-value glow" id="mPower" title="算力指数 ≈ √(总核心数/64 × 总内存GB/256) × 100，综合 CPU 与内存规模">0</div>
                    <div class="metric-label">算力指数</div>
                </div>
                <div class="metric">
                    <div class="metric-value accent" id="mMemory">0</div>
                    <div class="metric-label">物理内存</div>
                </div>
            </div>
        </section>

        <!-- 任务进度 -->
        <section class="card span-3">
            <h2 class="card-title">任务进度</h2>
            <div class="progress-row">
                <div class="progress-bar">
                    <div class="seg seg-done" id="segDone"></div>
                    <div class="seg seg-run" id="segRun"></div>
                    <div class="seg seg-pending" id="segPending"></div>
                    <div class="seg seg-failed" id="segFailed"></div>
                </div>
            </div>
            <div class="metrics small">
                <div class="metric">
                    <div class="metric-value success" id="mDone">0</div>
                    <div class="metric-label">已完成</div>
                </div>
                <div class="metric">
                    <div class="metric-value warn" id="mRun">0</div>
                    <div class="metric-label">进行中</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="mPending">0</div>
                    <div class="metric-label">待处理</div>
                </div>
                <div class="metric">
                    <div class="metric-value danger" id="mFailed">0</div>
                    <div class="metric-label">失败</div>
                </div>
            </div>
            <div class="fail-rate">失败率 <span id="failRate">0%</span></div>
        </section>

        <!-- 节点资源监控 -->
        <section class="card span-2">
            <div class="card-head">
                <h2 class="card-title">节点资源监控</h2>
                <div class="seg-control" id="monitorMode" role="tablist">
                    <button class="seg-btn active" data-mode="full" type="button" role="tab">完整视图</button>
                    <button class="seg-btn" data-mode="heatmap" type="button" role="tab">热图模式</button>
                </div>
            </div>

            <!-- 完整视图：节点卡片网格 -->
            <div class="node-grid" id="nodeList">
                <div class="empty">暂无节点上报</div>
            </div>

            <!-- 热图模式：CPU / 内存 两个格阵 -->
            <div class="heatmap-wrap" id="heatmapPanel" hidden>
                <div class="heatmap-sub">
                    <div class="heatmap-title">节点 CPU 利用率热图</div>
                    <div class="heatmap-grid" id="heatCpu"></div>
                </div>
                <div class="heatmap-sub">
                    <div class="heatmap-title">节点内存利用率热图</div>
                    <div class="heatmap-grid" id="heatMem"></div>
                </div>
                <div class="heatmap-legend">
                    <span>低</span>
                    <span class="legend-bar"></span>
                    <span>高 (100%)</span>
                </div>
            </div>

            <!-- 历史曲线：各节点 CPU / 内存 使用率 -->
            <div class="history-wrap" id="historyWrap">
                <div class="history-title">节点 CPU / 内存 历史使用率</div>
                <div class="history-chart" id="historyChart"></div>
            </div>
        </section>

        <!-- 失败调试面板 -->
        <section class="card span-1">
            <h2 class="card-title">失败调试</h2>
            <div class="failure-list" id="failureList">
                <div class="empty">无失败数据块</div>
            </div>
        </section>

        <!-- 日志流 -->
        <section class="card span-3">
            <h2 class="card-title">实时日志流</h2>
            <pre class="log-stream" id="logStream">等待数据…</pre>
        </section>
    </main>

    <footer class="statusbar">
        <span>SMB: <b id="smbRoot">/mnt/cluster</b></span>
        <span>HTTP: <b id="httpPort">8080</b></span>
        <span>轮询间隔: <b id="poll">1000</b> ms</span>
        <span>任务总数: <b id="totalJobs">0</b></span>
    </footer>

    <!-- 右下角 toast 消息容器 -->
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>

    <!-- 提交计算任务 模态框 -->
    <div class="modal-overlay" id="submitModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="submitModalTitle">
            <div class="modal-head">
                <h3 id="submitModalTitle">提交计算任务</h3>
                <button class="modal-close" id="btnCloseSubmit" type="button" aria-label="关闭">×</button>
            </div>
            <div class="modal-body">
                <div class="submit-form modal-form">
                    <label class="field">
                        <span class="field-label">CLR Assembly 路径 (SMB)</span>
                        <input id="inAssembly" placeholder="例如 \\smb\share\MyLib.dll" />
                    </label>
                    <label class="field">
                        <span class="field-label">方法名 Namespace.Class.Method</span>
                        <input id="inMethod" placeholder="例如 MyNamespace.MyClass.Run" />
                    </label>
                    <label class="field">
                        <span class="field-label">任务名称 (可选，留空则按方法名生成)</span>
                        <input id="inName" placeholder="例如 基因序列比对" />
                    </label>
                    <label class="field">
                        <span class="field-label">输入文件 (逗号分隔, 可选)</span>
                        <input id="inInputs" placeholder="例如 a.txt,b.txt" />
                    </label>
                </div>
                <div id="submitResult" class="submit-result"></div>
            </div>
            <div class="modal-foot">
                <button class="btn" id="btnCancelSubmit" type="button">取消</button>
                <button class="btn btn-accent" id="btnSubmit" type="button">提交任务</button>
            </div>
        </div>
    </div>

    <script src="/echarts.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
